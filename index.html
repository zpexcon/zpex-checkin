<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZPEX 체크인</title>
<style>
  :root {
    --zpex-red: #B40E22;
    --zpex-charcoal: #414141;
    --zpex-white: #FFFFFF;
    --zpex-lightgray: #F5F5F5;
    --zpex-bordergray: #D2D2D2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--zpex-lightgray);
    color: var(--zpex-charcoal);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .card {
    background: var(--zpex-white);
    border: 1px solid var(--zpex-bordergray);
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 {
    font-size: 18px;
    color: var(--zpex-red);
    margin: 0 0 4px;
  }
  .lang-btn {
    flex: none;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--zpex-bordergray);
    border-radius: 4px;
    background: var(--zpex-white);
    color: var(--zpex-charcoal);
    cursor: pointer;
  }
  .sub {
    font-size: 13px;
    color: var(--zpex-charcoal);
    opacity: 0.7;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    margin: 12px 0 4px;
  }
  input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--zpex-bordergray);
    border-radius: 6px;
    font-size: 16px;
  }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  /* 640px 기준 (조직 규칙 — 768px 사용 금지, Galaxy Z Fold 등 대응) */
  @media (max-width: 640px) {
    .action-row { flex-direction: column; }
  }
  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #btnCheckin { background: var(--zpex-red); color: var(--zpex-white); }
  #btnCheckout { background: var(--zpex-charcoal); color: var(--zpex-white); }
  #btnRegister { background: var(--zpex-red); color: var(--zpex-white); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-box {
    margin-top: 16px;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  .status-box.ok { background: #E8F5E9; color: #2E7D32; display: block; }
  .status-box.err { background: #FDECEA; color: var(--zpex-red); display: block; }
  #locNote { font-size: 12px; color: var(--zpex-charcoal); opacity: 0.6; margin-top: 8px; }
  #nameConfirm { font-size: 20px; font-weight: 700; color: var(--zpex-charcoal); min-height: 26px; margin-top: 2px; }
  .link-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 8px;
    background: none;
    border: none;
    color: var(--zpex-charcoal);
    font-size: 13px;
    font-weight: 400;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header-row">
    <h1 id="pageTitle">ZPEX 현장 체크인</h1>
    <button id="langToggle" type="button" class="lang-btn">EN</button>
  </div>
  <p class="sub" id="projectLabel">프로젝트 확인 중...</p>

  <div id="checkinView">
    <label for="employeeId" id="employeeIdLabel">사번 (Employee ID)</label>
    <input id="employeeId" name="employeeId" type="text" inputmode="text" autocomplete="username" placeholder="예: 2026XXX">
    <div id="nameConfirm"></div>

    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••">

    <div class="action-row">
      <button id="btnCheckin">체크인</button>
      <button id="btnCheckout">체크아웃</button>
    </div>

    <div id="status" class="status-box"></div>
    <p id="locNote">위치 확인 중...</p>
  </div>

  <div id="registerView" style="display:none;">
    <label for="regName" id="regNameLabel">이름 (Name)</label>
    <input id="regName" type="text" placeholder="예: 홍길동">

    <label for="regPin" id="regPinLabel">PIN 설정 (4~6자리 숫자)</label>
    <input id="regPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••">

    <div class="action-row">
      <button id="btnRegister">등록</button>
    </div>

    <div id="registerStatus" class="status-box"></div>
  </div>

  <button id="modeToggle" type="button" class="link-btn">신규 등록</button>
</div>

<script>
  const F05_ENDPOINT = "https://default3c1ae8a05e88491d86c07db19e932c.6d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/d9257750b2074539855daf89f2d08bad/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Pg6qPzXSXVvhbL17J7t1KyM0cPav8EhZcDx-HeL9JZc";
  const F05B_ENDPOINT = "https://default3c1ae8a05e88491d86c07db19e932c.6d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/a40dc018003142799d04d75a7f6b94b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=56djoOif5XIICI8L4fmDAIdY3eFqe-2sgeNZvFBGuVU";
  const F21_ENDPOINT = "https://default3c1ae8a05e88491d86c07db19e932c.6d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/21/workflows/22293c47cb8f4679b1e12efa0a66a042/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=E8Qs6zBpPPWgxmH_GuDmDk_69GRpif8dDhhoQih4tOo";

  // 한/영 번역 사전
  const translations = {
    ko: {
      pageTitle: "ZPEX 현장 체크인",
      toggleLabel: "EN",
      employeeIdLabel: "사번 (Employee ID)",
      employeeIdPlaceholder: "예: 2026XXX",
      btnCheckin: "체크인",
      btnCheckout: "체크아웃",
      projectWithCode: (code) => `현장 코드: ${code}`,
      projectNoCode: "⚠ 프로젝트 코드가 없습니다. QR을 다시 스캔하세요.",
      locChecking: "위치 확인 중...",
      locNotSupported: "이 브라우저는 위치 확인을 지원하지 않습니다.",
      locInRange: (m) => `현장 반경 내 확인됨 (약 ${m}m)`,
      locOutOfRange: (m) => `⚠ 현장에서 약 ${m}m 떨어져 있습니다. 현장 근처에서 다시 시도하세요.`,
      locNoSiteCoord: "위치 확인됨 (현장 좌표 정보 없음 — 서버에서 검증)",
      locFailed: "⚠ 위치 확인 실패. 위치 접근 권한을 허용해주세요.",
      needBoth: "사번과 PIN을 모두 입력하세요.",
      needLocation: "위치 확인이 완료된 후 시도하세요.",
      processing: "처리 중...",
      workerNotFound: "실패: 등록되지 않은 사번입니다.",
      networkError: "네트워크 오류. 다시 시도하세요.",
      doneCheckin: "체크인 완료",
      doneCheckout: "체크아웃 완료",
      late: " (지각)",
      unknownError: "알 수 없는 오류",
      registerLink: "신규 등록",
      backToCheckin: "← 체크인으로 돌아가기",
      nameLabel: "이름 (Name)",
      namePlaceholder: "예: 홍길동",
      pinSetupLabel: "PIN 설정 (4~6자리 숫자)",
      btnRegister: "등록",
      needNameAndPin: "이름과 PIN을 모두 입력하세요.",
      invalidPin: "PIN은 4~6자리 숫자여야 합니다.",
      registering: "등록 처리 중...",
      registerSuccess: (id) => `등록 완료! 사번: ${id} — 이 번호와 PIN으로 체크인하세요.`,
      reasons: {
        not_found: "등록되지 않은 사번입니다.",
        locked: "계정이 잠금되었습니다. 관리자에게 문의하세요.",
        pin_mismatch: "PIN이 일치하지 않습니다.",
        wrong_project: "이 현장에 배정된 작업자가 아닙니다.",
        out_of_range: "현장 범위를 벗어났습니다.",
        already_checked_in: "이미 체크인되었습니다.",
        not_checked_in: "체크인 기록이 없습니다.",
        project_not_found: "현장 코드를 확인할 수 없습니다. QR을 다시 스캔하세요."
      }
    },
    en: {
      pageTitle: "ZPEX Site Check-In",
      toggleLabel: "한국어",
      employeeIdLabel: "Employee ID",
      employeeIdPlaceholder: "e.g. 2026XXX",
      btnCheckin: "Check In",
      btnCheckout: "Check Out",
      projectWithCode: (code) => `Site Code: ${code}`,
      projectNoCode: "⚠ No project code found. Please rescan the QR code.",
      locChecking: "Checking location...",
      locNotSupported: "This browser does not support location services.",
      locInRange: (m) => `Within site range (approx. ${m}m)`,
      locOutOfRange: (m) => `⚠ You are approximately ${m}m from the site. Please try again near the site.`,
      locNoSiteCoord: "Location confirmed (no site coordinates set — verified on server)",
      locFailed: "⚠ Location check failed. Please allow location access.",
      needBoth: "Please enter both Employee ID and PIN.",
      needLocation: "Please wait for location confirmation.",
      processing: "Processing...",
      workerNotFound: "Failed: Employee ID not found.",
      networkError: "Network error. Please try again.",
      doneCheckin: "Check-in completed",
      doneCheckout: "Check-out completed",
      late: " (Late)",
      unknownError: "Unknown error",
      registerLink: "New Registration",
      backToCheckin: "← Back to Check-In",
      nameLabel: "Name",
      namePlaceholder: "e.g. John Doe",
      pinSetupLabel: "Set PIN (4-6 digits)",
      btnRegister: "Register",
      needNameAndPin: "Please enter both name and PIN.",
      invalidPin: "PIN must be 4-6 digits.",
      registering: "Registering...",
      registerSuccess: (id) => `Registration complete! Employee ID: ${id} — use this ID and PIN to check in.`,
      reasons: {
        not_found: "Employee ID not found.",
        locked: "Account locked. Please contact your administrator.",
        pin_mismatch: "PIN does not match.",
        wrong_project: "Not assigned to this project.",
        out_of_range: "Outside site range.",
        already_checked_in: "Already checked in.",
        not_checked_in: "No check-in record found.",
        project_not_found: "Project not found. Please rescan the QR code."
      }
    }
  };

  let currentLang = localStorage.getItem("zpexCheckinLang") || "ko";
  let currentView = "checkin";

  async function lookupWorker(employeeId) {
    const res = await fetch(F05B_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employeeId })
    });
    const data = await res.json();
    if (!data.success) return null;
    return { salt: data.salt, name: data.name };
  }

  async function hashPin(pin, salt) {
    const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin + salt));
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function generateSalt() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const params = new URLSearchParams(window.location.search);
  const projectCode = params.get("projectCode") || "";
  const siteLat = parseFloat(params.get("siteLat"));
  const siteLng = parseFloat(params.get("siteLng"));

  const pageTitleEl = document.getElementById("pageTitle");
  const langToggleBtn = document.getElementById("langToggle");
  const projectLabelEl = document.getElementById("projectLabel");
  const employeeIdLabelEl = document.getElementById("employeeIdLabel");
  let currentPos = null;
  const locNote = document.getElementById("locNote");
  const statusBox = document.getElementById("status");
  const btnCheckin = document.getElementById("btnCheckin");
  const btnCheckout = document.getElementById("btnCheckout");
  const employeeIdInput = document.getElementById("employeeId");
  const nameConfirm = document.getElementById("nameConfirm");

  const checkinView = document.getElementById("checkinView");
  const registerView = document.getElementById("registerView");
  const modeToggleBtn = document.getElementById("modeToggle");
  const regNameLabelEl = document.getElementById("regNameLabel");
  const regPinLabelEl = document.getElementById("regPinLabel");
  const regNameInput = document.getElementById("regName");
  const regPinInput = document.getElementById("regPin");
  const btnRegister = document.getElementById("btnRegister");
  const registerStatusBox = document.getElementById("registerStatus");

  function setButtonsEnabled(enabled) {
    btnCheckin.disabled = !enabled;
    btnCheckout.disabled = !enabled;
  }
  setButtonsEnabled(false);

  // 위치 상태(문구 재조합용) — 언어 전환 시 현재 상태 그대로 다시 렌더링하기 위함
  let locState = { type: "checking", dist: null };
  function renderLocNote() {
    const t = translations[currentLang];
    switch (locState.type) {
      case "notSupported": locNote.textContent = t.locNotSupported; break;
      case "inRange": locNote.textContent = t.locInRange(locState.dist); break;
      case "outOfRange": locNote.textContent = t.locOutOfRange(locState.dist); break;
      case "noSiteCoord": locNote.textContent = t.locNoSiteCoord; break;
      case "failed": locNote.textContent = t.locFailed; break;
      default: locNote.textContent = t.locChecking;
    }
  }

  function renderProjectLabel() {
    const t = translations[currentLang];
    projectLabelEl.textContent = projectCode ? t.projectWithCode(projectCode) : t.projectNoCode;
  }

  function renderModeToggle() {
    const t = translations[currentLang];
    modeToggleBtn.textContent = currentView === "checkin" ? t.registerLink : t.backToCheckin;
  }

  function applyLanguage() {
    const t = translations[currentLang];
    pageTitleEl.textContent = t.pageTitle;
    langToggleBtn.textContent = t.toggleLabel;
    employeeIdLabelEl.textContent = t.employeeIdLabel;
    employeeIdInput.placeholder = t.employeeIdPlaceholder;
    btnCheckin.textContent = t.btnCheckin;
    btnCheckout.textContent = t.btnCheckout;
    regNameLabelEl.textContent = t.nameLabel;
    regNameInput.placeholder = t.namePlaceholder;
    regPinLabelEl.textContent = t.pinSetupLabel;
    btnRegister.textContent = t.btnRegister;
    renderProjectLabel();
    renderLocNote();
    renderModeToggle();
  }
  applyLanguage();

  langToggleBtn.addEventListener("click", () => {
    currentLang = currentLang === "ko" ? "en" : "ko";
    localStorage.setItem("zpexCheckinLang", currentLang);
    applyLanguage();
  });

  modeToggleBtn.addEventListener("click", () => {
    currentView = currentView === "checkin" ? "register" : "checkin";
    checkinView.style.display = currentView === "checkin" ? "" : "none";
    registerView.style.display = currentView === "register" ? "" : "none";
    statusBox.textContent = "";
    statusBox.className = "status-box";
    registerStatusBox.textContent = "";
    registerStatusBox.className = "status-box";
    renderModeToggle();
  });

  // 사번 입력 시 이름 실시간 표시 (오타로 다른 사람 계정 입력하는 실수 방지) + 대문자 강제
  let lookupTimer = null;
  employeeIdInput.addEventListener("input", () => {
    const selStart = employeeIdInput.selectionStart;
    const selEnd = employeeIdInput.selectionEnd;
    employeeIdInput.value = employeeIdInput.value.toUpperCase();
    employeeIdInput.setSelectionRange(selStart, selEnd);

    const val = employeeIdInput.value.trim();
    nameConfirm.textContent = "";
    clearTimeout(lookupTimer);
    if (val.length < 3) return;
    lookupTimer = setTimeout(async () => {
      const worker = await lookupWorker(val);
      if (employeeIdInput.value.trim() !== val) return; // 그 사이 값이 바뀌었으면 무시
      nameConfirm.textContent = worker ? worker.name : "";
    }, 500);
  });

  // Haversine 거리 계산 (미터 단위) — 클라이언트 1차 확인용, 서버(F-05)에서 2차 검증
  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function showStatus(message, ok) {
    statusBox.textContent = message;
    statusBox.className = "status-box " + (ok ? "ok" : "err");
  }

  function showRegisterStatus(message, ok) {
    registerStatusBox.textContent = message;
    registerStatusBox.className = "status-box " + (ok ? "ok" : "err");
  }

  if (!navigator.geolocation) {
    locState = { type: "notSupported", dist: null };
    renderLocNote();
  } else {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentPos = pos.coords;
        if (!isNaN(siteLat) && !isNaN(siteLng)) {
          const dist = haversineMeters(currentPos.latitude, currentPos.longitude, siteLat, siteLng);
          if (dist <= 200) {
            locState = { type: "inRange", dist: Math.round(dist) };
            setButtonsEnabled(true);
          } else {
            locState = { type: "outOfRange", dist: Math.round(dist) };
            setButtonsEnabled(false);
          }
        } else {
          locState = { type: "noSiteCoord", dist: null };
          setButtonsEnabled(true);
        }
        renderLocNote();
      },
      () => {
        locState = { type: "failed", dist: null };
        renderLocNote();
        setButtonsEnabled(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function submitCheck(action) {
    const t = translations[currentLang];
    const employeeId = document.getElementById("employeeId").value.trim();
    const pin = document.getElementById("pin").value.trim();

    if (!employeeId || !pin) {
      showStatus(t.needBoth, false);
      return;
    }
    if (!currentPos) {
      showStatus(t.needLocation, false);
      return;
    }

    setButtonsEnabled(false);
    showStatus(t.processing, true);

    try {
      const worker = await lookupWorker(employeeId);
      if (!worker) {
        showStatus(t.workerNotFound, false);
        setButtonsEnabled(true);
        return;
      }
      const pinHash = await hashPin(pin, worker.salt);

      const res = await fetch(F05_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          employeeId,
          pinHash,
          projectCode,
          action,
          lat: currentPos.latitude,
          lng: currentPos.longitude
        })
      });
      const data = await res.json();

      if (data.success) {
        const label = action === "checkin" ? t.doneCheckin : t.doneCheckout;
        showStatus(`${label}: ${data.workerName || employeeId}${data.isLate ? t.late : ""}`, true);
      } else {
        showStatus(translateReason(data.reason), false);
      }
    } catch (e) {
      showStatus(t.networkError, false);
    } finally {
      setButtonsEnabled(true);
    }
  }

  async function submitRegister() {
    const t = translations[currentLang];
    const name = regNameInput.value.trim();
    const pin = regPinInput.value.trim();

    if (!name || !pin) {
      showRegisterStatus(t.needNameAndPin, false);
      return;
    }
    if (!/^\d{4,6}$/.test(pin)) {
      showRegisterStatus(t.invalidPin, false);
      return;
    }

    btnRegister.disabled = true;
    showRegisterStatus(t.registering, true);

    try {
      const pinSalt = await generateSalt();
      const pinHash = await hashPin(pin, pinSalt);

      const res = await fetch(F21_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, pinHash, pinSalt, projectCode })
      });
      const data = await res.json();

      if (data.success) {
        showRegisterStatus(t.registerSuccess(data.employeeId), true);
        regNameInput.value = "";
        regPinInput.value = "";
      } else {
        showRegisterStatus(translateReason(data.reason), false);
      }
    } catch (e) {
      showRegisterStatus(t.networkError, false);
    } finally {
      btnRegister.disabled = false;
    }
  }

  function translateReason(reason) {
    const t = translations[currentLang];
    return t.reasons[reason] || reason || t.unknownError;
  }

  btnCheckin.addEventListener("click", () => submitCheck("checkin"));
  btnCheckout.addEventListener("click", () => submitCheck("checkout"));
  btnRegister.addEventListener("click", submitRegister);
</script>
</body>
</html>
