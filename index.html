<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZPEX 체크인</title>
<style>
  :root {
    --zpex-red: #B40E22;
    --zpex-charcoal: #414141;
    --zpex-white: #FFFFFF;
    --zpex-lightgray: #F5F5F5;
    --zpex-bordergray: #D2D2D2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--zpex-lightgray);
    color: var(--zpex-charcoal);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .card {
    background: var(--zpex-white);
    border: 1px solid var(--zpex-bordergray);
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 {
    font-size: 18px;
    color: var(--zpex-red);
    margin: 0 0 4px;
  }
  /* 언어 선택 (한국어/영어/스페인어) */
  .lang-group {
    display: flex;
    flex: none;
    border: 1px solid var(--zpex-bordergray);
    border-radius: 4px;
    overflow: hidden;
  }
  .lang-btn {
    flex: none;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    border: none;
    border-radius: 0;
    background: var(--zpex-white);
    color: var(--zpex-charcoal);
    cursor: pointer;
  }
  .lang-btn + .lang-btn { border-left: 1px solid var(--zpex-bordergray); }
  .lang-btn.active { background: var(--zpex-red); color: var(--zpex-white); }
  .sub {
    font-size: 13px;
    color: var(--zpex-charcoal);
    opacity: 0.7;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    margin: 12px 0 4px;
  }
  input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--zpex-bordergray);
    border-radius: 6px;
    font-size: 16px;
  }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  /* 640px 기준 (조직 규칙 — 768px 사용 금지, Galaxy Z Fold 등 대응) */
  @media (max-width: 640px) {
    .action-row { flex-direction: column; }
  }
  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #btnCheckin { background: var(--zpex-red); color: var(--zpex-white); }
  #btnCheckout { background: var(--zpex-charcoal); color: var(--zpex-white); }
  #btnRegister { background: var(--zpex-red); color: var(--zpex-white); }
  #btnGoCheckin { background: var(--zpex-red); color: var(--zpex-white); font-size: 17px; padding: 14px; }
  /* 등록 전 이름 확인 화면 — 철자 확인 기회 (등록 후 재입력 시 사번 중복 발급 방지) */
  #registerConfirm { display: none; text-align: center; }
  .confirm-title { font-size: 16px; font-weight: 700; margin: 4px 0 16px; }
  .confirm-name-label { font-size: 14px; opacity: 0.7; }
  .confirm-name { font-size: 32px; font-weight: 800; color: var(--zpex-charcoal); line-height: 1.2; margin: 4px 0 16px; word-break: break-word; }
  .confirm-note { font-size: 14px; line-height: 1.5; opacity: 0.8; }
  #btnConfirmEdit { background: var(--zpex-lightgray); color: var(--zpex-charcoal); border: 1px solid var(--zpex-bordergray); }
  #btnConfirmRegister { background: var(--zpex-red); color: var(--zpex-white); }
  /* 등록 완료 화면 — 사번을 크게 보여주고 기억하도록 안내 */
  #registerDone { display: none; text-align: center; }
  .done-title { font-size: 18px; font-weight: 700; color: #2E7D32; margin: 4px 0 16px; }
  .done-name { font-size: 22px; font-weight: 700; color: var(--zpex-charcoal); margin: 0 0 12px; word-break: break-word; }
  .done-id-label { font-size: 14px; color: var(--zpex-charcoal); opacity: 0.7; }
  .done-id { font-size: 56px; font-weight: 800; color: var(--zpex-red); letter-spacing: 4px; line-height: 1.1; margin: 4px 0 16px; }
  .done-notice { background: #FFF8E1; border: 1px solid #FFC107; border-radius: 6px; padding: 12px; font-size: 15px; font-weight: 600; line-height: 1.5; text-align: left; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-box {
    margin-top: 16px;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  .status-box.ok { background: #E8F5E9; color: #2E7D32; display: block; }
  .status-box.err { background: #FDECEA; color: var(--zpex-red); display: block; }
  #locNote { font-size: 12px; color: var(--zpex-charcoal); opacity: 0.6; margin-top: 8px; }
  #nameConfirm { font-size: 20px; font-weight: 700; color: var(--zpex-charcoal); min-height: 26px; margin-top: 2px; }
  .link-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 8px;
    background: none;
    border: none;
    color: var(--zpex-charcoal);
    font-size: 13px;
    font-weight: 400;
    text-decoration: underline;
    cursor: pointer;
  }
</style>

  async function lookupWorker(employeeId) {
    const res = await fetch(F05B_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employeeId })
    });
    const data = await res.json();
    if (!data.success) return null;
    return { salt: data.salt, name: data.name };
  }

  async function hashPin(pin, salt) {
    const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin + salt));
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function generateSalt() {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function renderProjectLabel() {
    const t = translations[currentLang];
    projectLabelEl.textContent = projectCode ? t.projectWithCode(projectCode) : t.projectNoCode;
  }

  function renderModeToggle() {
    const t = translations[currentLang];
    modeToggleBtn.textContent = currentView === "checkin" ? t.registerLink : t.backToCheckin;
  }

  function applyLanguage() {
    const t = translations[currentLang];
    pageTitleEl.textContent = t.pageTitle;
    document.documentElement.lang = currentLang;
    langBtns.forEach(b => b.classList.toggle("active", b.dataset.lang === currentLang));
    employeeIdLabelEl.textContent = t.employeeIdLabel;
    employeeIdInput.placeholder = t.employeeIdPlaceholder;
    btnCheckin.textContent = t.btnCheckin;
    btnCheckout.textContent = t.btnCheckout;
    regNameLabelEl.textContent = t.nameLabel;
    regNameInput.placeholder = t.namePlaceholder;
    regPinLabelEl.textContent = t.pinSetupLabel;
    btnRegister.textContent = t.btnRegister;
    confirmTitleEl.textContent = t.confirmTitle;
    confirmNameLabelEl.textContent = t.confirmNameLabel;
    confirmNoteEl.textContent = t.confirmNote;
    btnConfirmEdit.textContent = t.btnConfirmEdit;
    btnConfirmRegister.textContent = t.btnConfirmRegister;
    doneTitleEl.textContent = t.doneTitle;
    doneIdLabelEl.textContent = t.doneIdLabel;
    doneNoticeEl.textContent = t.doneNotice;
    btnGoCheckin.textContent = t.btnGoCheckin;
    renderProjectLabel();
    renderLocNote();
    renderModeToggle();
  }
  applyLanguage();

  langBtns.forEach(b => b.addEventListener("click", () => {
    currentLang = b.dataset.lang;
    localStorage.setItem("zpexCheckinLang", currentLang);
    applyLanguage();
  }));

  function setView(view) {
    currentView = view;
    checkinView.style.display = currentView === "checkin" ? "" : "none";
    registerView.style.display = currentView === "register" ? "" : "none";
    statusBox.textContent = "";
    statusBox.className = "status-box";
    registerStatusBox.textContent = "";
    registerStatusBox.className = "status-box";
    // 등록 완료 화면은 떠날 때 초기화 (다음 등록 시 입력 폼부터 다시 보이도록)
    registerForm.style.display = "";
    registerConfirm.style.display = "none";
    registerDone.style.display = "none";
    modeToggleBtn.style.display = "";
    renderModeToggle();
  }

  modeToggleBtn.addEventListener("click", () => {
    setView(currentView === "checkin" ? "register" : "checkin");
  });

  // 등록 완료 → 체크인 화면으로 이동하면서 방금 받은 사번을 미리 채움 (이름 확인도 자동 실행)
  btnGoCheckin.addEventListener("click", () => {
    const id = doneIdEl.textContent;
    setView("checkin");
    employeeIdInput.value = id;
    employeeIdInput.dispatchEvent(new Event("input"));
    document.getElementById("pin").focus();
  });

  // 사번 입력 시 이름 실시간 표시 (오타로 다른 사람 계정 입력하는 실수 방지) + 대문자 강제
  let lookupTimer = null;
  employeeIdInput.addEventListener("input", () => {
    const selStart = employeeIdInput.selectionStart;
    const selEnd = employeeIdInput.selectionEnd;
    employeeIdInput.value = employeeIdInput.value.toUpperCase();
    employeeIdInput.setSelectionRange(selStart, selEnd);

    const val = employeeIdInput.value.trim();
    nameConfirm.textContent = "";
    clearTimeout(lookupTimer);
    if (val.length < 3) return;
    lookupTimer = setTimeout(async () => {
      const worker = await lookupWorker(val);
      if (employeeIdInput.value.trim() !== val) return; // 그 사이 값이 바뀌었으면 무시
      nameConfirm.textContent = worker ? worker.name : "";
    }, 500);
  });

  // Haversine 거리 계산 (미터 단위) — 클라이언트 1차 확인용, 서버(F-05)에서 2차 검증
  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function showStatus(message, ok) {
    statusBox.textContent = message;
    statusBox.className = "status-box " + (ok ? "ok" : "err");
  }

  function showRegisterStatus(message, ok) {
    registerStatusBox.textContent = message;
    registerStatusBox.className = "status-box " + (ok ? "ok" : "err");
  }

  if (!navigator.geolocation) {
    locState = { type: "notSupported", dist: null };
    renderLocNote();
  } else {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentPos = pos.coords;
        if (!isNaN(siteLat) && !isNaN(siteLng)) {
          // 범위 판정은 F-05가 프로젝트별 반경(Projects.GeofenceRadiusM)으로 수행 — 페이지는 거리 안내만 (2026-09-25)
          const dist = haversineMeters(currentPos.latitude, currentPos.longitude, siteLat, siteLng);
          locState = { type: "distance", dist: Math.round(dist) };
          setButtonsEnabled(true);
        } else {
          locState = { type: "noSiteCoord", dist: null };
          setButtonsEnabled(true);
        }
        renderLocNote();
      },
      () => {
        locState = { type: "failed", dist: null };
        renderLocNote();
        setButtonsEnabled(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function submitCheck(action) {
    const t = translations[currentLang];
    const employeeId = document.getElementById("employeeId").value.trim();
    const pin = document.getElementById("pin").value.trim();

    if (!employeeId || !pin) {
      showStatus(t.needBoth, false);
      return;
    }
    if (!currentPos) {
      showStatus(t.needLocation, false);
      return;
    }

    setButtonsEnabled(false);
    showStatus(t.processing, true);

    try {
      const worker = await lookupWorker(employeeId);
      if (!worker) {
        showStatus(t.workerNotFound, false);
        setButtonsEnabled(true);
        return;
      }
      const pinHash = await hashPin(pin, worker.salt);

      const res = await fetch(F05_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          employeeId,
          pinHash,
          projectCode,
          action,
          lat: currentPos.latitude,
          lng: currentPos.longitude
        })
      });
      const data = await res.json();

      if (data.success) {
        const label = action === "checkin" ? t.doneCheckin : t.doneCheckout;
        showStatus(`${label}: ${data.workerName || employeeId}${data.isLate ? t.late : ""}`, true);
      } else {
        showStatus(translateReason(data.reason), false);
      }
    } catch (e) {
      showStatus(t.networkError, false);
    } finally {
      setButtonsEnabled(true);
    }
  }

  // 1단계: 입력 검증 후 이름 확인 화면으로 (아직 등록 안 함)
  function submitRegister() {
    const t = translations[currentLang];
    const name = regNameInput.value.trim();
    const pin = regPinInput.value.trim();

    if (!name || !pin) {
      showRegisterStatus(t.needNameAndPin, false);
      return;
    }
    if (!/^\d{4,6}$/.test(pin)) {
      showRegisterStatus(t.invalidPin, false);
      return;
    }

    registerStatusBox.textContent = "";
    registerStatusBox.className = "status-box";
    confirmStatusBox.textContent = "";
    confirmStatusBox.className = "status-box";
    confirmNameEl.textContent = name;
    registerForm.style.display = "none";
    registerConfirm.style.display = "block";
  }

  // 이름이 틀렸으면 입력 폼으로 복귀 (입력값 유지)
  function editRegister() {
    registerConfirm.style.display = "none";
    registerForm.style.display = "";
    regNameInput.focus();
  }

  // 2단계: 확인 후 실제 등록 (F-21 호출 → 사번 발급)
  async function confirmRegister() {
    const t = translations[currentLang];
    const name = regNameInput.value.trim();
    const pin = regPinInput.value.trim();

    btnConfirmRegister.disabled = true;
    btnConfirmEdit.disabled = true;
    confirmStatusBox.textContent = t.registering;
    confirmStatusBox.className = "status-box ok";

    try {
      const pinSalt = await generateSalt();
      const pinHash = await hashPin(pin, pinSalt);

      const res = await fetch(F21_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, pinHash, pinSalt, projectCode })
      });
      const data = await res.json();

      if (data.success) {
        confirmStatusBox.textContent = "";
        confirmStatusBox.className = "status-box";
        doneNameEl.textContent = name;
        doneIdEl.textContent = data.employeeId;
        registerConfirm.style.display = "none";
        registerDone.style.display = "block";
        modeToggleBtn.style.display = "none";
        regNameInput.value = "";
        regPinInput.value = "";
      } else {
        confirmStatusBox.textContent = translateReason(data.reason);
        confirmStatusBox.className = "status-box err";
      }
    } catch (e) {
      confirmStatusBox.textContent = t.networkError;
      confirmStatusBox.className = "status-box err";
    } finally {
      btnConfirmRegister.disabled = false;
      btnConfirmEdit.disabled = false;
    }
  }

  function translateReason(reason) {
    const t = translations[currentLang];
    return t.reasons[reason] || reason || t.unknownError;
  }

  btnCheckin.addEventListener("click", () => submitCheck("checkin"));
  btnCheckout.addEventListener("click", () => submitCheck("checkout"));
  btnRegister.addEventListener("click", submitRegister);
  btnConfirmEdit.addEventListener("click", editRegister);
  btnConfirmRegister.addEventListener("click", confirmRegister);
</script>
</body>
